name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  graph-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Graph engine tests
        run: node --test tests/
      - name: Syntax check site modules
        run: |
          for f in site/app.js site/engine/graph.js site/engine/templates.js site/engine/store.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done
